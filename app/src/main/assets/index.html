<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rihan Star — Player 1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b29;color:white;font-family:monospace;touch-action:none}#wrap{height:100dvh;display:flex;flex-direction:column;max-width:1000px;margin:auto;background:#101449}header{display:flex;justify-content:space-between;padding:8px 12px;background:#101c63;border-bottom:3px solid #ffca45;font-weight:bold;font-size:clamp(14px,3.5vw,22px)}.health{height:12px;background:#351b4a;border:2px solid white;margin:4px 12px}.health span{display:block;background:linear-gradient(#fff16a,#ff9e16);height:100%;width:100%}canvas{width:100%;flex:1;min-height:0;image-rendering:pixelated;background:#21185e}#hud{display:flex;justify-content:space-between;padding:4px 12px;color:#ffd84a;font-size:12px}.controls{display:flex;justify-content:space-between;padding:8px 12px;gap:8px;background:#090d35}.cluster{display:flex;gap:6px}.key{min-width:44px;height:52px;border:3px solid #f9d65a;border-radius:9px;background:#252d79;color:white;font:bold 16px monospace;touch-action:none}.attack{background:#a52551}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#070a2bdf;text-align:center;padding:20px}.panel{max-width:440px}h1{color:#ffcf4b;text-shadow:3px 3px #e33b30;font-size:clamp(26px,7vw,44px)}p{line-height:1.5}.start{border:3px solid white;background:#e74235;color:white;padding:12px 20px;font:bold 18px monospace}
</style></head><body><div id="wrap"><header><span>⭐ RIHAN STAR</span><span>PLAYER 1</span></header><div class="health"><span id="hp"></span></div><canvas id="game" width="480" height="270"></canvas><div id="hud"><span>STAGE 1 • ROOFTOP</span><span id="score">SCORE 000000</span><span id="timer">TIME 99</span></div><div class="controls"><div><small>MOVE</small><div class="cluster"><button class="key" data-k="left">◀</button><button class="key" data-k="right">▶</button><button class="key" data-k="jump">▲</button></div></div><div><small>FIGHT</small><div class="cluster"><button class="key attack" data-k="punch">PUNCH</button><button class="key attack" data-k="kick">KICK</button></div></div></div></div><div class="overlay" id="overlay"><div class="panel"><h1 id="title">RIHAN STAR</h1><p id="message">PLAYER 1 • RETRO ARCADE FIGHTER<br>Defeat the rival. Become the pixel champion!</p><button class="start" id="start">PRESS START</button><p>Move: arrows / buttons · Attack: A, S / PUNCH, KICK</p></div></div>
<script>
(()=>{const c=document.querySelector('canvas'),g=c.getContext('2d'),ov=document.getElementById('overlay'),hp=document.getElementById('hp'),scoreEl=document.getElementById('score'),timerEl=document.getElementById('timer');let active=false,score=0,time=99,frame=0,keys={},p={},e={};function reset(){p={x:95,y:195,vy:0,hp:100,attack:0,flash:0};e={x:365,y:195,hp:100,attack:0,flash:0};score=0;time=99;frame=0;hp.style.width='100%';scoreEl.textContent='SCORE 000000';timerEl.textContent='TIME 99'}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}function fighter(a,hero){let x=a.x,y=a.y;g.save();if(!hero){g.translate(x*2+18,0);g.scale(-1,1);g.translate(-x*2-18,0)}let coat=a.flash?'white':hero?'#191b48':'#9a224f',trim=hero?'#ffcf48':'#68e9ff';rect(x-9,y+30,9,20,'#f0b47c');rect(x+5,y+30,9,20,'#f0b47c');rect(x-12,y+47,16,6,'#ef334c');rect(x+2,y+47,17,6,'#ef334c');rect(x-14,y+50,19,5,'#161a40');rect(x+1,y+50,20,5,'#161a40');rect(x-12,y+4,27,30,coat);rect(x-12,y+4,27,4,trim);rect(x-10,y-16,24,22,'#eeb783');rect(x-12,y-19,27,12,'#18172d');rect(x-9,y-22,20,5,'#17172b');rect(x-8,y-7,7,5,'#f45a38');rect(x+3,y-7,7,5,'#f45a38');rect(x-19,y+8,a.attack?24:10,8,'#eeb783');rect(x-20,y+6,a.attack?10:8,12,coat);rect(x+9,y+8,10,8,'#eeb783');rect(x+12,y+5,8,11,coat);g.restore()}function draw(){let grad=g.createLinearGradient(0,0,0,270);grad.addColorStop(0,'#30276d');grad.addColorStop(.55,'#ed5a72');grad.addColorStop(1,'#ffb24e');g.fillStyle=grad;g.fillRect(0,0,480,270);rect(324,64,48,48,'#ffe46b');rect(332,72,32,32,'#fff09b');for(let i=0;i<9;i++){let x=i*63-12;rect(x,118-(i%3)*12,38,65,'#332c70');rect(x+6,111-(i%3)*12,26,10,'#4c3c92')}rect(0,174,480,5,'#ffbe54');rect(0,180,480,90,'#633b53');for(let i=0;i<10;i++){rect(i*52,188,2,82,'#9d5b55');rect(0,204+i*15,480,2,'#b66b58')}fighter(p,true);fighter(e,false);rect(14,12,104,18,'#10133e');rect(17,15,Math.max(0,p.hp)*.98,12,'#f6ca43');rect(365,12,101,18,'#10133e');rect(368,15,Math.max(0,e.hp)*.95,12,'#ef4554');g.fillStyle='white';g.font='bold 9px monospace';g.fillText('RIHAN STAR',15,9);g.fillText('RIVAL',408,9)}function tick(){if(!active)return;frame++;if(keys.left)p.x-=2.2;if(keys.right)p.x+=2.2;if(keys.jump&&p.y>=195)p.vy=-7.2;p.vy+=.32;p.y+=p.vy;if(p.y>195){p.y=195;p.vy=0}p.x=Math.max(20,Math.min(440,p.x));if(p.attack>0)p.attack--;if(e.attack>0)e.attack--;if(p.flash>0)p.flash--;if(e.flash>0)e.flash--;if(frame%70===0){e.attack=12;if(Math.abs(p.x-e.x)<65&&Math.abs(p.y-e.y)<30){p.hp=Math.max(0,p.hp-8);p.flash=5;hp.style.width=p.hp+'%'}}if(frame%80===0&&Math.abs(p.x-e.x)>44)e.x+=(p.x<e.x?-1:1)*4;if(frame%120===0){time=Math.max(0,time-1);timerEl.textContent='TIME '+time}if((keys.punch||keys.kick)&&p.attack===0){p.attack=12;if(Math.abs(p.x-e.x)<72&&Math.abs(p.y-e.y)<32){e.hp=Math.max(0,e.hp-(keys.kick?15:10));e.flash=5;score+=keys.kick?150:100;scoreEl.textContent='SCORE '+String(score).padStart(6,'0')}}if(e.hp<=0||p.hp<=0||time<=0){active=false;ov.style.display='flex';document.getElementById('title').textContent=e.hp<=0?'YOU WIN, RIHAN!':'TRY AGAIN, PLAYER 1';document.getElementById('message').innerHTML=(e.hp<=0?'🏆 PIXEL CHAMPION!':'The rival got you this round.')+'<br>Score: '+score;document.getElementById('start').textContent='PLAY AGAIN'}draw();requestAnimationFrame(tick)}document.getElementById('start').onclick=()=>{reset();ov.style.display='none';active=true;draw();requestAnimationFrame(tick)};function set(k,v){keys[k]=v;document.querySelectorAll('[data-k="'+k+'"]').forEach(b=>b.classList.toggle('on',v))}document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',ev=>{ev.preventDefault();set(k,true)});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>set(k,false)))});window.addEventListener('keydown',ev=>{let m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',a:'punch',A:'punch',s:'kick',S:'kick',' ':'jump'};if(m[ev.key]){ev.preventDefault();set(m[ev.key],true)}});window.addEventListener('keyup',ev=>{let m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',a:'punch',A:'punch',s:'kick',S:'kick',' ':'jump'};if(m[ev.key])set(m[ev.key],false)});reset();draw()})();
</script></body></html>
